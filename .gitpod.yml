tasks:
  - name: load deps, setup cypress, then run lint
    init: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter coolboard-smoketests exec cypress install
    command: |
      pnpm next lint
      pnpm --filter coolboard-smoketests exec cypress verify
      pnpm --filter coolboard-smoketests cy run
image:
  file: .gitpod.Dockerfile
