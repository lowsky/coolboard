version: 2.1

parameters:
  test-url:
    type: string
    default: ''
  deployed-sha:
    type: string
    default: ''

commands:
  halt-if-no-test-url:
    steps:
      - run:
          name: Skip if no test-url parameter
          command: |
            if [ -z "${CYPRESS_baseUrl}" ]; then
              echo "No test-url parameter — skipping."
              exit 1
            fi

workflows:
  all:
    when:
      and:
        - equal: [api, << pipeline.trigger_source >>]
        - not:
            equal: ['', << pipeline.parameters.test-url >>]
    jobs:
      - test

executors:
  cypress-executor:
    docker:
      - image: cypress/base:26.13.0@sha256:5f5138fff456c4250cb327421f6a43e71c3feb50e46f95b3261c5bdc6f4b0531
    resource_class: lowsky/selfhosted

jobs:
  test:
    executor: cypress-executor
    environment:
      CYPRESS_baseUrl: << pipeline.parameters.test-url >>
      EXPECTED_GIT_SHA: << pipeline.parameters.deployed-sha >>
      DISPLAY: :99
    steps:
      - halt-if-no-test-url
      - checkout
      - run:
          name: Verify deployed version matches expected SHA
          command: |
            cd smoketest
            export GIT_SHA1=${EXPECTED_GIT_SHA:-$CIRCLE_SHA1}
            check-deployed-version/check-deployed-version || CHECK_VERSION=$?
            if [ "x-$CHECK_VERSION" == "x-255" ]; then
              echo "Version mismatch: expected $EXPECTED_GIT_SHA"
              exit 1
            fi
      - restore_cache:
          keys:
            - cache-smoketest-v2-{{ arch }}-{{ checksum "smoketest/yarn.lock" }}

      - run:
          name: Setup clean display for Cypress
          command: |
            set -e
            # Kill any existing Xvfb from previous runs on self-hosted executor
            pkill -9 Xvfb 2>/dev/null || true
            sleep 1
            # Start fresh Xvfb on display :99
            Xvfb :99 -screen 0 1280x1024x24 &
            sleep 2
            echo "Xvfb started, DISPLAY=:99"
            ps aux | grep '[X]vfb'
      - run:
          name: Install dependencies
          command: |
            cd smoketest
            npm install -g yarn@1.22.10
            yarn install --immutable
            yarn cypress install
            yarn cypress info
      - save_cache:
          key: cache-smoketest-v2-{{ arch }}-{{ checksum "smoketest/yarn.lock" }}
          paths:
            - /root/.yarn/berry
            - /root/.cache/Cypress

      - run:
          name: Run Cypress smoke tests
          command: |
            cd smoketest
            mkdir -p cypress/results
            CYPRESS_branch=${CIRCLE_BRANCH} yarn cypress run --reporter junit --reporter-options mochaFile=cypress/results/test-results.xml,toConsole=true \
              -x VERCEL_AUTOMATION_BYPASS_SECRET=$VERCEL_AUTOMATION_BYPASS_SECRET,PASSWORD=$PASSWORD,PRODUCTION_PASSWORD=$PRODUCTION_PASSWORD,BRANCH=$BRANCH \
              --record --key ${CYPRESS_RECORD_KEY}
      - store_test_results:
          path: smoketest/cypress/results
      - store_artifacts:
          path: /root/project/smoketest/cypress/screenshots
          destination: screenshots
      - store_artifacts:
          path: /root/project/smoketest/cypress/videos
          destination: videos
