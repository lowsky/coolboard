version: 2.1
orbs:
  github-status: assurance-maladie-digital/github-status@1.3.0

parameters:
  test-url:
    type: string
    default: ''
  deployed-sha:
    type: string
    default: ''

# have a filter to disable regular builds.
workflows:
  all:
    jobs:
      - pr-pending
      - test:
          requires:
            - pr-pending
      - pr-success:
          requires:
            - test
      # LATER- report-failed-status-only-custom: requires: - test

executors:
  executor_with_curl:
    docker:
      - image: cimg/base:stable@sha256:35e5e29930ab565475a4f2aa9b4124998ed67dbc7b0e2dd5f420a4189d08d0d2

jobs:
  pr-pending:
    executor: executor_with_curl
    environment:
      DEBUG: true
    steps:
      - run: echo "export TARGET_URL=$CIRCLE_BUILD_URL" >> $BASH_ENV
      - github-status/pending:
          description: pending
          context: e2e/cypress-test
  report-failed-status-only:
    executor: executor_with_curl
    steps:
      - run: exit 1
      - github-status/report_failed_only
  report-failed-status-only-custom:
    executor: executor_with_curl
    steps:
      - run: echo "export TARGET_URL=$CIRCLE_BUILD_URL" >> $BASH_ENV
      - run: exit 1
      - github-status/report_failed_only:
          context: ci/integration
          description: "Integration pipeline failed"

  pr-success:
    executor: executor_with_curl
    environment:
      CYPRESS_baseUrl: << pipeline.parameters.test-url >>
      DEBUG: true
    steps:
      - run:
          name: pre-check for params
          command: |
            if [  "x" == "x${CYPRESS_baseUrl}"  ] ;  then
              circleci step halt # does nothing
              circleci-agent step halt # does nothing

              echo "   No parameters -skipping build ..."
              exit 0
            fi
      - github-status/post_status:
          context: e2e/cypress-test
          description: success
          state: success

  install_and_cache:
    docker:
      - image: cypress/base:26.0.0@sha256:446be8fcb63e3cad2f9a4e14720e3d8e35993e12f36da541e09f5740a4c2477c
    resource_class: lowsky/selfhosted
    steps:
      - checkout
      - restore_cache:
          keys:
            - cache-smoketest-pnpm-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: smoketest - pnpm install
          command: |
            npm install -g pnpm
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm install --frozen-lockfile
      - save_cache:
          key: cache-smoketest-pnpm-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - smoketest/node_modules
  test:
    docker:
      - image: cypress/base:26.0.0@sha256:446be8fcb63e3cad2f9a4e14720e3d8e35993e12f36da541e09f5740a4c2477c
    resource_class: lowsky/selfhosted
    environment:
      CYPRESS_baseUrl: << pipeline.parameters.test-url >>
      EXPECTED_GIT_SHA: << pipeline.parameters.deployed-sha >>
      CYPRESS_branch: ${CIRCLE_BRANCH}
    steps:
      - run:
          name: Check if parameters for PR-run exist
          command: |
            echo CYPRESS_baseUrl: $CYPRESS_baseUrl
      - run:
          name: pre-check for params
          command: |
            if [  "x" == "x${CYPRESS_baseUrl}"  ] ;  then
              circleci step halt # does nothing
              circleci-agent step halt # does nothing
              echo "   No parameters -skipping build ..."
              echo "   No parameters - mark build as failed, even when there was already a good run ..."
              exit 1
            fi

      - checkout
      - run:
          name: check matching of versions
          command: |
            cd smoketest

            echo export  CYPRESS_baseUrl=$CYPRESS_baseUrl
            echo
            echo _DEBUG:  circle.ci -
            echo        CIRCLE_SHA1=$CIRCLE_SHA1
            echo _DEBUG:
            echo _DEBUG:  expecting
            echo export EXPECTED_GIT_SHA=$EXPECTED_GIT_SHA
            echo export GIT_SHA1=${EXPECTED_GIT_SHA:-$CIRCLE_SHA1}
            echo _DEBUG:
            echo _DEBUG:  running
            echo      check-deployed-version/check-deployed-version

            export GIT_SHA1=${EXPECTED_GIT_SHA:-$CIRCLE_SHA1}
            check-deployed-version/check-deployed-version || CHECK_VERSION=$?

            echo _  Result:  $CHECK_VERSION

            if [  "x-$CHECK_VERSION" == "x-255"  ] ;  then
              echo "Version does not match with $EXPECTED_GIT_SHA"
              exit -1
            fi

      - restore_cache:
          keys:
            - cache-smoketest-pnpm-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: smoketest - pnpm install cypress
          command: |
            npm install -g pnpm
            pnpm install --frozen-lockfile
            pnpm --filter coolboard-smoketests exec cypress install
      - save_cache:
          key: cache-smoketest-pnpm-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - smoketest/node_modules

      - run:
          name: run cypress
          command: |
            cd smoketest
            mkdir -p cypress/results

            echo _DEBUG:  running without reporting to cypress.io:
            echo   CYPRESS_branch=${CIRCLE_BRANCH} pnpm --filter coolboard-smoketests run cy run -- --record --key $CYPRESS_API_KEY --reporter junit --reporter-options mochaFile=cypress/results/test-results.xml,toConsole=true
            echo   CYPRESS_branch=${CIRCLE_BRANCH} pnpm --filter coolboard-smoketests run cy run -- --reporter junit --reporter-options mochaFile=cypress/results/test-results.xml,toConsole=true
            echo ...without reporting to cypress.io:

            cd smoketest
            CYPRESS_branch=${CIRCLE_BRANCH} pnpm run cy run -- --reporter junit --reporter-options mochaFile=cypress/results/test-results.xml,toConsole=true \
              -x VERCEL_AUTOMATION_BYPASS_SECRET=$VERCEL_AUTOMATION_BYPASS_SECRET,PASSWORD=$PASSWORD,PRODUCTION_PASSWORD=$PRODUCTION_PASSWORD,BRANCH=$BRANCH

      - store_test_results:
          path: smoketest/cypress/results
      - store_artifacts:
          path: /root/project/smoketest/cypress/screenshots
          destination: screenshots
      - store_artifacts:
          path: /root/project/smoketest/cypress/videos
          destination: videos
